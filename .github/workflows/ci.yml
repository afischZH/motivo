name: CI

# E2E runs in Chromium only (decision Andreas 2026-10-28). Firefox and WebKit
# projects stay in playwright.config.ts for manual runs (`pnpm test:e2e`).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Placeholder donation link, so e2e/support.spec.ts checks the button
      # (without it, the spec checks the "link follows soon" state instead).
      NEXT_PUBLIC_DONATION_URL: https://donate.example/musterli
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @musterli/web exec playwright install --with-deps chromium

      # The Playwright web server runs `next start` in CI, so the app must be built first.
      - name: Build
        run: pnpm build

      - name: Run E2E tests
        run: pnpm --filter @musterli/web exec playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-chromium
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
